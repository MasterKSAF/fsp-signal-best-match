<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signal — подбор IT-специалистов</title>
    <meta name="description" content="Подбор IT-специалистов по навыкам, опыту и условиям работы. Профиль кандидата, проверка навыков и приглашения от компаний." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Signal — подбор IT-специалистов" />
    <meta property="og:description" content="Подбор по навыкам, опыту и условиям работы." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Signal — подбор IT-специалистов" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        const stored = localStorage.getItem('fsp-theme');
        const preference = ['light', 'dark', 'system'].includes(stored) ? stored : 'system';
        const motion = localStorage.getItem('fsp-motion');
        document.documentElement.dataset.motion = ['reduced', 'off'].includes(motion) ? motion : 'system';
        const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
