  schemas:
    OwnedAccount:
      {
        "type": "object",
        "properties":
          {
            "id": { "type": "integer" },
            "displayName": { "type": "string" },
            "email": { "type": "string" },
            "emailVerified": { "type": "boolean" },
            "role": { "type": "string", "enum": [ "candidate", "employer" ] },
            "demoMode": { "type": "boolean" },
            "reviewMode": { "type": "boolean" },
            "createdAt": { "type": "string", "format": "date-time" },
            "professionalAlias": { "type": [ "string", "null" ] }
          },
        "required":
          [
            "id",
            "displayName",
            "email",
            "emailVerified",
            "role",
            "demoMode",
            "reviewMode",
            "createdAt",
            "professionalAlias"
          ]
      }
    CompanyInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        description:
          type: string
          maxLength: 3000
        industry:
          type: string
          minLength: 2
          maxLength: 160
        inn:
          type: string
          maxLength: 12
          pattern: '^(?:[0-9]{10}|[0-9]{12})?$'
          description: Optional company INN, stored as text to preserve leading zeros. Empty clears it; omission preserves the
            current value. The server validates check digits locally without a registry lookup.
