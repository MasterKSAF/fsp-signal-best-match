                  type: string
                  enum:
                    - month
                    - year
                salaryType:
                  type: string
                  enum:
                    - gross
                    - net
                revision:
                  type: integer
                  minimum: 1
                status:
                  type: string
                  enum:
                    - active
                    - archived
              required:
                - revision
