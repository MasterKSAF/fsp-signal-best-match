          type: string
          enum:
            - participation
            - prize
            - win
    FspRankingSignal:
      description: Current server-trusted FSP facts. MAX explicit participation=1, prize=2, win=3; no accumulation, no effect
        on grade or common need-fit, no movement between specialization and verified-grade categories. Synthetic history
        is a Demo fixture, not a real registry result.
      type: object
      additionalProperties: false
      required:
        - policyVersion
        - historyStatus
        - bestResult
        - bonus
        - source
        - synthetic
        - note
      properties:
        policyVersion:
          type: string
