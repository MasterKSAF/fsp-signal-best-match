    SelectionContextRef:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - job
            - need
        id:
          type: integer
          minimum: 1
          maximum: 2147483647
      required:
        - type
        - id
      description: Exactly one owned job OR private need. IDs are not interchangeable; all reads and commands recheck company
        ownership and current access.
    CompetitiveRevisionInput:
      type: object
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 1
      required:
