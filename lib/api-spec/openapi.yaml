        requirements.
      parameters: []
      responses:
        "200":
          description: Authorized result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementPreview"
        "400":
          description: Invalid input (invalid_input where supplied).
          content:
            application/json:
              schema: &a29
                $ref: "#/components/schemas/CompetitiveApiError"
        "401":
          description: Session required.
          content:
            application/json:
              schema: *a29
        "403":
          description: Wrong role or denied company action.
          content:
            application/json:
              schema: *a29
        "409":
          description: command_conflict, preview_processing or discarded_stale.
          content:
            application/json:
              schema: *a29
        "429":
          description: "preview_limit: bounded per-company/context work."
          content:
            application/json:
              schema: *a29
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                context:
                  $ref: "#/components/schemas/SelectionContextRef"
                patch:
                  $ref: "#/components/schemas/RequirementPatch"
                commandKey:
                  type: string
                  minLength: 8
                  maxLength: 120
              required:
                - context
                - patch
                - commandKey
