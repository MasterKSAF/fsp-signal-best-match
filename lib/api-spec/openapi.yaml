          enum:
            - trusted_results
            - unresolved_results
            - unverified
            - none
        bestResult:
          type:
            - string
            - "null"
          enum:
            - participation
            - prize
            - win
            - null
        bonus:
          type: integer
          minimum: 0
          maximum: 3
        source:
          type:
            - string
            - "null"
          enum:
            - synthetic_fixture
            - null
        synthetic:
          type: boolean
        note:
          type: string
          minLength: 1
