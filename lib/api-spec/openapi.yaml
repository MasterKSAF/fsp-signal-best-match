                    before saving; unknown nonempty requirements are retained.
                  items:
                    type: string
                    minLength: 1
                    maxLength: 100
                    pattern: \S
                requiredSkillLevels:
                  type: object
                  description: Explicit minimum levels for selected required skills. Absent levels impose no implicit minimum.
                  additionalProperties:
                    type: string
                    enum:
                      - Junior
                      - Middle
                      - Senior
                desirableSkills:
                  type: array
                  maxItems: 40
                  items:
                    type: string
                    maxLength: 100
                description:
                  type: string
                  minLength: 10
                  maxLength: 3000
