    post:
      operationId: uploadResumePdf
      tags:
        - pdf-import
      security:
        - sessionCookie: []
      description: Candidate owner and exact CV revision required before extraction. Authentication precedes 7 MB JSON parser.
        Bytes discarded after extraction; private draft expires in 24 hours. No CV mutation, grade or confirmed skills
        until reviewed apply.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                resumeId:
                  type: integer
                  minimum: 1
                revision:
                  type: integer
                  minimum: 1
                data:
                  type: string
                  format: byte
                  maxLength: 6990508
                  description: Standard base64 of PDF bytes (not data URL), maximum decoded size 5,242,880 bytes.
              required:
                - resumeId
                - revision
                - data
      responses:
        "201":
          description: Authorized result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  id:
                    type: string
                    format: uuid
                  state:
                    type: string
                    enum:
                      - draft
                  requiresReview:
                    type: boolean
                    enum:
                      - true
                required:
                  - id
                  - state
                  - requiresReview
        "400":
          description: PDF_INPUT_INVALID, PDF_ENCODING, PDF_TYPE_OR_SIZE; malformed JSON has no code.
          content:
            application/json:
              schema: &a29
                $ref: "#/components/schemas/CompetitiveApiError"
        "401":
          description: Session required.
          content:
            application/json:
              schema: *a29
        "403":
          description: Wrong role or denied company action.
          content:
            application/json:
              schema: *a29
        "404":
          description: Owned record unavailable; foreign IDs are not disclosed.
          content:
            application/json:
              schema: *a29
        "409":
          description: RESUME_REVISION_CONFLICT
          content:
            application/json:
              schema: *a29
        "413":
          description: JSON body exceeds endpoint 7 MB parser limit. code is absent.
          content:
            application/json:
              schema: *a29
        "422":
          description: PDF_TYPE_OR_SIZE, PDF_ENCRYPTED, PDF_LIMIT, PDF_PAGE_LIMIT, PDF_EXPANSION_LIMIT, PDF_TEXT_LIMIT,
            PDF_PARSE_FAILED, PDF_WORKER_FAILED, PDF_TIMEOUT, PDF_OUTPUT_LIMIT; no OCR is promised.
          content:
            application/json:
              schema: *a29
        "429":
          description: PDF_RATE_LIMIT (10 documents/hour), PDF_BUSY.
          content:
            application/json:
              schema: *a29
        "503":
          description: PDF_WORKER_UNAVAILABLE or PDF_WORKER_FAILED
          content:
            application/json:
              schema: *a29
