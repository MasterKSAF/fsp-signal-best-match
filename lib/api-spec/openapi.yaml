  /me/fsp-connection/import:
    post:
      operationId: requestFspImport
      tags: [ profile ]
      summary: Request an FSP import with separate explicit consent
      description: Registry integration is not configured. This operation never imports a synthetic fixture, persists consent
        or confirms the ID. A saved ID is required before returning registry_not_configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ consentImport ]
              properties:
                consentImport: { type: boolean, const: true }
            example: { consentImport: true }
      responses:
        '400':
          description: Missing explicit consent or extra request fields; code fsp_import_consent_required
        '401':
          description: Sign-in required
        '403':
          description: Candidate role or trusted browser origin required
        '409':
          description: No saved ID; code fsp_id_required
        '503':
          description: Registry not configured; code registry_not_configured. Stored proof, grades and contacts are unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example: { code: registry_not_configured, error: 'Реестр ФСП ещё не подключён. ID сохранён без подтверждения и импорта.' }
        default:
          $ref: '#/components/responses/UnifiedErrorResponse'
