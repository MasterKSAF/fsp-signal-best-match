openapi: 3.1.0
info:
  title: Api
  version: 0.7.0
  description: FSP SIGNAL candidate assessment, explainable matching, and invitations API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: public
  - name: auth
  - name: profile
  - name: assessment
  - name: employer
  - name: matching
  - name: invitations
  - name: quality
paths:
  /employer/company:
    get:
      operationId: getEmployerCompany
      tags:
        - employer
      responses:
        "200":
          description: Company belonging to the authenticated employer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResult"
        "400":
          $ref: "#/components/responses/UnifiedErrorResponse"
        "401":
          $ref: "#/components/responses/UnifiedErrorResponse"
        "403":
          $ref: "#/components/responses/UnifiedErrorResponse"
        "404":
          $ref: "#/components/responses/UnifiedErrorResponse"
        default:
          $ref: "#/components/responses/UnifiedErrorResponse"

    put:
      operationId: saveEmployerCompany
      tags:
        - employer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
      responses:
        "200":
          description: Updated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResult"
        "400":
          $ref: "#/components/responses/UnifiedErrorResponse"
        "401":
          $ref: "#/components/responses/UnifiedErrorResponse"
        "403":
          $ref: "#/components/responses/UnifiedErrorResponse"
        "404":
          $ref: "#/components/responses/UnifiedErrorResponse"
        default:
          $ref: "#/components/responses/UnifiedErrorResponse"

  /assessments/history:
    get:
      operationId: getAssessmentHistory
      tags:
        - assessment
      responses:
        "200":
          description: Up to 50 owned attempts newest first, without answers or oracles
          content:
            application/json:
              schema:
                type: object
                properties:
                  attempts:
                    type: array
                    items:
                      $ref: "#/components/schemas/AssessmentHistoryItem"
                required:
                  - attempts
        "401":
          $ref: "#/components/responses/UnifiedErrorResponse"
        "403":
          $ref: "#/components/responses/UnifiedErrorResponse"
        default:
          $ref: "#/components/responses/UnifiedErrorResponse"

  /quality/evaluation:
    get:
      operationId: getQualityEvaluation
      tags:
        - quality
      responses:
        "200":
          description: Reproducible synthetic control, explicitly not an independent hiring benchmark
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityEvaluation"
  /healthz:
    get:
      operationId: healthCheck
      tags:
        - health
      responses:
        "200":
          description: Server health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /public/demo-summary:
    get:
      operationId: getDemoSummary
      tags:
        - public
      summary: Get honest summary of the local synthetic dataset
      responses:
        "200":
          description: Demo summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoSummary"
  /auth/register:
    post:
      operationId: register
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Account created; local verification is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResult"
        "400":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerificationInput"
      responses:
        "200":
          description: Email verified and session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/ApiError"
  /auth/login:
    post:
      operationId: login
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /auth/demo-session:
    post:
      operationId: startDemoSession
      tags:
        - auth
      summary: Start a clearly marked synthetic candidate or employer session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoSessionInput"
      responses:
        "200":
          description: Demo session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/logout:
    post:
      operationId: logout
      tags:
        - auth
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /me:
    get:
      operationId: getCurrentUser
      tags:
        - profile
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/ApiError"
  /me/candidate-profile:
    get:
      operationId: getCandidateProfile
      tags:
        - profile
      responses:
        "200":
          description: Private candidate profile for its owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateProfile"
        "401":
          $ref: "#/components/responses/ApiError"
    put:
      operationId: saveCandidateProfile
      tags:
        - profile
      description: Save one explicitly addressed owned CV and shared identity atomically. Body resumeId and both current CV
        revision and identityRevision from an owner GET are mandatory; query resumeId alone never selects a CV for
        writes. A stale version returns409 before any field changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateProfileInput"
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateProfile"
        "400":
          $ref: "#/components/responses/ApiError"
        "409":
          description: The selected CV or shared account identity has changed. Refresh deliberately and preserve the unsaved
            draft; never automatically replay it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateProfileRevisionConflict"
        "401":
          $ref: "#/components/responses/ApiError"
  /me/invitations:
    get:
      operationId: listMyInvitations
      tags:
        - invitations
      responses:
        "200":
          description: Invitations addressed to this candidate
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CandidateInvitation"
        "401":
          $ref: "#/components/responses/UnifiedErrorResponse"
        "403":
          $ref: "#/components/responses/UnifiedErrorResponse"
        default:
          $ref: "#/components/responses/UnifiedErrorResponse"
      security:
        - sessionCookie: []

  /me/invitations/{id}/decision:
    post:
      operationId: decideInvitation
      tags:
        - invitations
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationDecisionInput"
      responses:
        "200":
          description: Invitation decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationDecisionResult"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /me/invitations/{id}/revoke-contact:
    post:
      operationId: revokeInvitationContact
      tags:
        - invitations
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Candidate revoked the company's further contact access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          $ref: "#/components/responses/ApiError"
  /assessments/programs:
    get:
      operationId: listAssessmentPrograms
      tags:
        - assessment
      responses:
        "200":
          description: Available and explicitly unavailable assessment directions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssessmentProgram"
  /assessments/attempts:
    post:
      operationId: startAssessmentAttempt
      tags:
        - assessment
      description: New legacy issuance is closed under read_complete_only regardless of feature flags. An already open owned
        attempt may be resumed; use skill-attempts for new modular checks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentStartInput"
      responses:
        "201":
          description: Historical creation response shape; current legacy policy only restores existing attempts and rejects new
            issuance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentAttempt"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /assessments/attempts/{id}:
    get:
      operationId: getAssessmentAttempt
      tags:
        - assessment
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: resumeId
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          description: If supplied, must equal immutable attempt target, even after target deletion.
      responses:
        "200":
          description: Owned attempt, without answer keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentAttempt"
        "404":
          $ref: "#/components/responses/ApiError"
  /assessments/attempts/{id}/answers:
    put:
      operationId: saveAssessmentAnswers
      tags:
        - assessment
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: resumeId
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          description: If supplied, must equal immutable attempt target, even after target deletion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentAnswersInput"
      responses:
        "200":
          description: Saved attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentAttempt"
        "404":
          $ref: "#/components/responses/ApiError"
  /assessments/attempts/{id}/submit:
    post:
      operationId: submitAssessmentAttempt
      tags:
        - assessment
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: resumeId
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          description: If supplied, must equal immutable attempt target, even after target deletion.
      responses:
        "200":
          description: Scored assessment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentResult"
        "409":
          $ref: "#/components/responses/ApiError"
  /employer/needs:
    get:
      operationId: listEmployerNeeds
      tags:
        - employer
      responses:
        "200":
          description: Needs owned by the current company
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployerNeed"
        "400":
          $ref: "#/components/responses/UnifiedErrorResponse"
        "401":
          $ref: "#/components/responses/UnifiedErrorResponse"
        "403":
          $ref: "#/components/responses/UnifiedErrorResponse"
        default:
          $ref: "#/components/responses/UnifiedErrorResponse"

    post:
      operationId: createEmployerNeed
      tags:
        - employer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployerNeedInput"
      responses:
        "201":
          description: Saved employer need
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployerNeed"
        "400":
          $ref: "#/components/responses/ApiError"
  /matches:
    get:
      operationId: getMatches
      tags:
        - matching
      parameters:
        - name: needId
          in: query
          required: true
          schema:
            type: integer

            maximum: 2147483647
            minimum: 1
        - name: resumeId
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: resumeIds
          in: query
          schema:
            type: string
          description: Comma separated at most100resumeIDs; oneperperson. Exclusive withresumeId.
      responses:
        "200":
          description: Stable, explainable candidate selection with anonymous fields only
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchCandidate"
        "404":
          $ref: "#/components/responses/ApiError"
      description: " Current company/context/CV consent is rechecked. Factor ledger explains the existing rank; internal
        computation leases/fences are not a public task API."
  /matches/explanation:
    get:
      operationId: getMatchExplanation
      tags:
        - matching
      parameters:
        - name: candidateId
          in: query
          required: true
          schema:
            type: integer

            maximum: 2147483647
            minimum: 1
        - name: needId
          in: query
          required: true
          schema:
            type: integer

            maximum: 2147483647
            minimum: 1
        - name: resumeId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: Requirement-to-evidence explanation with provenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchExplanation"
        "404":
          $ref: "#/components/responses/ApiError"
      description: " Current company/context/CV consent is rechecked. Factor ledger explains the existing rank; internal
        computation leases/fences are not a public task API."
  /employer/invitations:
    get:
      operationId: listEmployerInvitations
      tags:
        - invitations
      responses:
        "200":
          description: Outgoing invitations and current statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/UnifiedErrorResponse"
        "401":
          $ref: "#/components/responses/UnifiedErrorResponse"
        "403":
          $ref: "#/components/responses/UnifiedErrorResponse"
        default:
          $ref: "#/components/responses/UnifiedErrorResponse"

    post:
      operationId: createInvitation
      tags:
        - invitations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Salary-transparent invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /employer/invitations/{id}/contacts:
    get:
      operationId: getInvitationContacts
      tags:
        - invitations
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Candidate contacts, only for the accepting company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactDisclosure"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
  /employer/invitations/{id}/withdraw:
    post:
      operationId: withdrawInvitation
      tags:
        - invitations
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Withdrawn invitation, if it is still withdrawable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "409":
          $ref: "#/components/responses/ApiError"
  /fsp/status:
    get:
      operationId: getFspStatus
      tags:
        - profile
      responses:
        "200":
          description: Honest status for demonstration registry provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FspStatus"
  /quality/report:
    get:
      operationId: getQualityReport
      tags:
        - quality
      responses:
        "200":
          description: Reproducible checks and unmeasured evaluation limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityReport"
  /me/resume:
    get:
      operationId: getCandidateResume
      tags:
        - profile
      responses:
        "200":
          description: Own resume, questionnaire and up to 20 completed questionnaire snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateResume"
        "401":
          description: Authentication required
        "403":
          description: Candidate role required
    put:
      operationId: saveCandidateResume
      tags:
        - profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateResumeInput"
      responses:
        "200":
          description: Saved resume; changed completed questionnaire adds a history snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateResume"
        "400":
          description: Invalid fields, unsafe URL, too many entries or reversed dates
        "401":
          description: Authentication required
        "403":
          description: Candidate role required
  /me/resume/pdf:
    get:
      operationId: downloadCandidateResumePdf
      tags:
        - profile
      responses:
        "200":
          description: Private PDF with embedded Cyrillic fonts, pagination and saved profile/resume; phone and email are omitted
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="Signal-Resume.pdf"
            Cache-Control:
              schema:
                type: string
              description: no-store, private
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Authentication required
        "403":
          description: Candidate role required
  /me/fsp-connection:
    get:
      tags:
        - profile
      operationId: getFspConnection
      summary: Get the authenticated candidate's FSP connection
      description: Requires a verified candidate session. An entered identifier is not proof of ownership. No FSP network API
        is called.
      responses:
        "200":
          description: Connection, consent and imported achievements; empty history is a normal state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FspConnection"
        "401":
          description: Sign-in required
        "403":
          description: Candidate role required
    put:
      tags:
        - profile
      operationId: saveFspConnection
      summary: Save an opaque FSP ID without importing results
      description: Accepts only fspId. Each save records a fresh requestedAt and clears previous external proof and consent.
        Every entered ID, including FSP-DEMO-2026, remains pending with no achievements or ranking bonus. Saving does
        not call a registry, verify identity, grant import consent or reserve the ID globally.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FspConnectionInput"
      responses:
        "200":
          description: Pending connection with empty achievements, null consent and verification timestamps, and
            importAvailable=false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FspConnection"
        "400":
          description: Invalid ID or extra fields, including consentImport
        "401":
          description: Sign-in required
        "403":
          description: Candidate role or trusted browser origin required
    delete:
      tags:
        - profile
      operationId: unlinkFspConnection
      summary: Revoke FSP import consent and unlink the ID
      description: Idempotent. Removes stored external identifier, achievements and provenance and atomically removes the FSP
        ranking flag. Keeps the minimal consent/revocation timestamps. Assessment results and the rest of the profile
        are preserved.
      responses:
        "200":
          description: Unlinked connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FspConnection"
        "401":
          description: Sign-in required
        "403":
          description: Candidate role or trusted browser origin required
  /assessments/contexts:
    get:
      summary: Три профиля проверки и собственные активные приглашения кандидата
      responses:
        "200":
          description: Справочник; ключей ответов и внутренних переключателей генератора нет
          content:
            application/json:
              schema:
                type: object
                required:
                  - profiles
                  - invitations
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: "#/components/schemas/AssessmentContextProfile"
                  invitations:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - title
                        - snapshot
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        snapshot:
                          $ref: "#/components/schemas/AssessmentContextSnapshot"
        "401":
          description: Нет сессии
        "403":
          description: Сессия работодателя
      operationId: getAssessmentContexts
      tags:
        - assessment
      parameters:
        - in: query
          name: programId
          required: false
          schema:
            type: string
            enum:
              - backend-python
              - frontend-typescript
            default: backend-python
  /assessments/attempts/{id}/context:
    get:
      summary: Неизменяемое описание собственной попытки кандидата
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            maximum: 2147483647
            minimum: 1
      responses:
        "200":
          description: Для старой попытки без контекста snapshot равен null
          content:
            application/json:
              schema:
                type: object
                required:
                  - snapshot
                properties:
                  snapshot:
                    oneOf:
                      - $ref: "#/components/schemas/AssessmentContextSnapshot"
                      - type: "null"
        "400":
          description: Некорректный id
        "401":
          description: Нет сессии
        "403":
          description: Сессия работодателя
        "404":
          description: Нет попытки или она принадлежит другому кандидату
      operationId: getAssessmentAttemptContext
      tags:
        - assessment
  /employer/needs/{id}/assessment-context:
    get:
      summary: Направление проверки и карта требований собственной потребности
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            maximum: 2147483647
            minimum: 1
      responses:
        "200":
          description: Категория берётся из потребности работодателя
          content:
            application/json:
              schema:
                type: object
                required:
                  - supported
                  - targetGrade
                  - context
                  - reason
                  - matchedRequirements
                  - unsupportedRequirements
                properties:
                  supported:
                    type: boolean
                  targetGrade:
                    type: string
                    enum:
                      - Junior
                      - Middle
                      - Senior
                  context:
                    $ref: "#/components/schemas/AssessmentContextProfile"
                  reason:
                    type: string
                  matchedRequirements:
                    type: array
                    items:
                      type: string
                  unsupportedRequirements:
                    type: array
                    items:
                      type: string
        "400":
          description: Некорректный id
        "401":
          description: Нет сессии
        "403":
          description: Сессия кандидата
        "404":
          description: Нет потребности или она принадлежит другой компании
      operationId: getEmployerNeedAssessmentContext
      tags:
        - employer
  /employer/candidates:
    get:
      operationId: getCandidateCatalog
      tags:
        - trust
      description: Authorized employer pool only; whole-resume AND filters, person deduplication before count/pagination. Real
        photo filter observes current identity visibility; no contacts or answer keys.
      responses:
        "200":
          description: Successful authorized operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateCatalog"
        "400": &a24
          $ref: "#/components/responses/ApiError"
        "401": *a24
        "403": *a24
        "404": *a24
