    AtsWebhookEvent:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            schema: &a29
              type: string
              enum:
                - signal-ats-event-v1
            id: &a30
              type: string
              format: uuid
            tenant: &a33
              type: integer
              minimum: 1
            entity: &a34
              type: object
              additionalProperties: false
              properties:
                type:
                  type: string
                  enum:
                    - application
                    - invitation
                    - cv
                id:
                  type: integer
                  minimum: 1
                version:
                  type: string
                  pattern: ^[1-9]\d{0,25}$
                  description: Monotonic decimal sequence string; do not parse as JS floating point.
              required:
                - type
                - id
                - version
            occurredAt: &a35
              type: string
              format: date-time
            type:
              type: string
              enum:
                - application.status_changed
                - invitation.status_changed
            data:
              type: object
              additionalProperties: false
              properties:
                status:
                  type: string
                  minLength: 1
                  maxLength: 40
                contextType:
                  type: string
                  enum:
                    - job
                    - need
                contextId:
                  type: integer
                  minimum: 1
                resumeId:
                  type: integer
                  minimum: 1
              required:
                - status
                - contextType
                - contextId
                - resumeId
          required:
            - schema
            - id
            - tenant
            - entity
            - occurredAt
            - type
            - data
        - type: object
          additionalProperties: false
          properties:
            schema: *a29
            id: *a30
            tenant: *a33
            entity: *a34
            occurredAt: *a35
            type:
              type: string
              enum:
                - cv.access_revoked
            data:
              type: object
              additionalProperties: false
              properties:
                resumeId:
                  type: integer
                  minimum: 1
              required:
                - resumeId
          required:
            - schema
            - id
            - tenant
            - entity
            - occurredAt
            - type
            - data
      description: Outbound wire allowlist, canonical JSON. X-Signal-Id = event UUID; X-Signal-Timestamp = Unix seconds;
        X-Signal-Signature = lowercase hex HMAC-SHA256(secret, timestamp + "." + eventId + "." + raw body). Receiver
        helper enforces ±300 seconds and byte-identical UUID replay. No names, CVs, contacts, notes, exam answers or
        need descriptions. There is no public inbound webhook route in this app.
