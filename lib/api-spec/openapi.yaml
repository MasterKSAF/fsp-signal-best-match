    RequirementPatch:
      type: object
      additionalProperties: false
      properties:
        grade:
          type: string
          enum:
            - Junior
            - Middle
            - Senior
        gradeMode:
          $ref: "#/components/schemas/RequirementMode"
        requiredSkills:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
          minItems: 1
          maxItems: 20
        skillRequirements:
          type: array
          items:
            $ref: "#/components/schemas/RecruitingSkillRequirement"
          maxItems: 40
        workFormat:
          type: string
          enum:
            - Удалённо
            - Офис
            - Гибрид
      required: []
      minProperties: 1
      description: Only present fields are changed. Canonical catalog skills, unique after normalization. Invalid combinations
        are rejected.
    RequirementPreview:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        context:
          $ref: "#/components/schemas/SelectionContextRef"
        baseRevision:
          type: integer
          minimum: 1
        patch:
          $ref: "#/components/schemas/RequirementPatch"
        patchHash:
          type: string
          pattern: ^[0-9a-f]{64}$
        expiresAt:
          type: string
          format: date-time
        appliedRevision:
          anyOf:
            - type: integer
              minimum: 1
            - type: "null"
        currentPool:
          type: string
        expectedPool:
          type: string
        smallGroupSuppressed:
          type: boolean
        emptyResult:
          type: boolean
        diff:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
                enum:
                  - grade
                  - gradeMode
                  - requiredSkills
                  - skillRequirements
                  - workFormat
              before: &a29
                anyOf:
                  - type: string
                  - type: array
                    items:
                      type: string
                  - type: array
                    items:
                      $ref: "#/components/schemas/RecruitingSkillRequirement"
                  - type: "null"
              after: *a29
            required:
              - field
              - before
              - after
        versions:
          type: object
          additionalProperties: false
          properties:
            algorithm:
              type: string
            requirementsPolicy:
              type: string
            contextRevision:
              type: integer
              minimum: 1
          required:
            - algorithm
            - requirementsPolicy
            - contextRevision
      required:
        - id
        - context
        - baseRevision
        - patch
        - patchHash
        - expiresAt
        - appliedRevision
        - currentPool
        - expectedPool
        - smallGroupSuppressed
        - emptyResult
        - diff
        - versions
      description: 10-minute preview. Counts are bands, including suppression below five; no candidate identities or hidden
        pool data. Applying rechecks all dependency versions.
