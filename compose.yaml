name: fsp-signal
services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signal-local}
      POSTGRES_DB: signal
    ports: ["127.0.0.1:${SIGNAL_DB_PORT:-55433}:5432"]
    volumes: ["signal-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal"]
      interval: 3s
      timeout: 3s
      retries: 20
  mail:
    image: axllent/mailpit@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    ports: ["127.0.0.1:${SIGNAL_MAIL_PORT:-8026}:8025"]
  app:
    profiles: ["full"]
    build: .
    environment:
      DATABASE_URL: postgresql://signal:${POSTGRES_PASSWORD:-signal-local}@db:5432/signal
      NODE_ENV: production
      PORT: 4310
      HOST: 0.0.0.0
      DEMO_MODE: "true"
      MAILPIT_URL: http://mail:8025
      PUBLIC_URL: http://localhost:${SIGNAL_HTTP_PORT:-4310}
      VERIFICATION_TOKEN_SECRET: ${VERIFICATION_TOKEN_SECRET:?Run node scripts/setup-env.mjs first}
    ports: ["127.0.0.1:${SIGNAL_HTTP_PORT:-4310}:4310"]
    depends_on:
      db: { condition: service_healthy }
      mail: { condition: service_started }
    command: ["node", "scripts/container-start.mjs"]
volumes:
  signal-data:
