            "type": "string",
            "format": "date-time",
            "nullable": true
          }
        },
        "required": [
          "id",
          "snapshot",
          "status",
          "dueAt",
          "shareResult"
        ]
      },
      "OpportunityError": {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          }
        },
        "required": [
          "error"
        ]
      },
      "OpportunityMessage": {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          }
        },
        "required": [
          "message"
        ]
      },
      "MicrotaskSubscription": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer"
          },
          "templateId": {
            "type": "integer"
          },
          "candidateUserId": {
            "type": "integer"
          },
          "active": {
            "type": "boolean"
          },
          "nextDueAt": {
            "type": "string",
            "format": "date-time"
          },
          "title": {
            "type": "string"
          },
          "companyName": {
            "type": "string"
          }
        }
      },
      "AddressedContact": {
        "type": "object",
        "properties": {
          "displayName": {
            "type": "string"
          },
          "email": {
            "type": "string"
          },
          "phone": {
            "type": "string",
            "nullable": true
          },
          "consentedAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "displayName",
          "email",
          "consentedAt"
        ]
      },
      "JobConditionsSnapshot": {
        "type": "object",
        "properties": {
          "title": {
            "type": "string",
            "minLength": 3,
            "maxLength": 160
          },
          "description": {
            "type": "string",
            "minLength": 30,
            "maxLength": 6000
          },
          "specialization": {
            "type": "string"
          },
          "grade": {
            "type": "string",
            "enum": [
              "Junior",
              "Middle",
              "Senior"
            ]
          },
          "skills": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "workFormat": {
            "type": "string",
            "enum": [
              "Удалённо",
              "Офис",
              "Гибрид"
            ]
          },
          "salaryMin": {
            "type": "integer",
            "minimum": 1
          },
          "salaryMax": {
            "type": "integer",
            "minimum": 1
          },
          "salaryPeriod": {
            "type": "string",
            "enum": [
              "month",
              "year"
            ]
          },
          "salaryType": {
            "type": "string",
            "enum": [
              "gross",
              "net"
            ]
          },
          "version": {
            "type": "integer"
          },
          "companyName": {
            "type": "string"
          }
        },
        "required": [
          "title",
          "description",
          "specialization",
          "grade",
          "skills",
          "workFormat",
          "salaryMin",
          "salaryMax",
          "salaryPeriod",
          "salaryType",
          "version",
          "companyName"
        ]
      }
    }
  }
}