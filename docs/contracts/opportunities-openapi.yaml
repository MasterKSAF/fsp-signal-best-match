        "summary": "Addressed grants with invitation/application basis and revoke timestamps",
        "tags": [
          "Opportunities"
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "properties": {
                      "id": {
                        "type": "integer"
                      },
                      "companyId": {
                        "type": "integer"
                      },
                      "companyName": {
                        "type": "string"
                      },
                      "invitationId": {
                        "type": "integer",
                        "nullable": true
                      },
                      "applicationId": {
                        "type": "integer",
                        "nullable": true
                      },
                      "consentedAt": {
                        "type": "string",
                        "format": "date-time"
                      },
                      "revokedAt": {
                        "type": "string",
                        "format": "date-time",
                        "nullable": true
                      }
                    }
                  }
                }
              }
            }
          },
          "400": {
